# Captured verbatim from /opt/marketing-site/nginx.conf on multiverse-games-hel1, 2026-09-20.
# See ../../DEPLOY.md for what's authoritative (the box, not this file) and how to reconcile drift.
#
server {
    listen 80;
    server_name multiversestudios.xyz www.multiversestudios.xyz;
    root /usr/share/nginx/html;
    index index.html;

    # SPA-style fallback for clean URLs
    location / {
        try_files $uri $uri/ $uri.html =404;
        # Don't cache HTML
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Health check
    location /health {
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # Cache static assets (with query-string busting)
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1000;
}
