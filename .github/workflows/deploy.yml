name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.HETZNER_HOST }} >> ~/.ssh/known_hosts

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Bake same-origin versions.json (server-side, no CORS)
        run: node scripts/gen-versions.mjs .

      - name: Content-hash asset refs for cache-busting (fail-closed)
        run: node scripts/hash-assets.mjs .

      - name: Rsync files to server
        run: |
          rsync -avz --delete \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.wrangler' \
            --exclude='scripts' \
            ./ root@${{ secrets.HETZNER_HOST }}:/opt/marketing-site/html/

      # Must run BEFORE the build: the Dockerfile does `COPY html/ ...`, so anything
      # written to html/ after the build never reaches the served image.
      - name: Stamp deployment marker
        run: |
          ssh root@${{ secrets.HETZNER_HOST }} \
            "echo '${{ github.sha }}' > /opt/marketing-site/html/deployed-sha.txt"

      - name: Rebuild Docker container
        run: |
          ssh root@${{ secrets.HETZNER_HOST }} 'cd /opt/marketing-site && docker compose build && docker compose up -d'

      # Fail-closed: proves the box we rsynced to is the box actually serving
      # multiversestudios.xyz, with THIS commit. The previous check only curled `/`
      # for a 200, which passed even while the deploy went to a decommissioned box —
      # every run reported success for weeks while production was untouched (2026-08-02).
      - name: Health check (verify the deployed commit is live)
        run: |
          sleep 5
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" https://multiversestudios.xyz/)
          if [ "$RESPONSE" != "200" ]; then
            echo "Health check failed: site returned HTTP $RESPONSE"
            exit 1
          fi

          LIVE_SHA=$(curl -s --max-time 20 https://multiversestudios.xyz/deployed-sha.txt | tr -d '[:space:]')
          if [ "$LIVE_SHA" != "${{ github.sha }}" ]; then
            echo "DEPLOY VERIFICATION FAILED."
            echo "  expected commit: ${{ github.sha }}"
            echo "  live site serves: '${LIVE_SHA}'"
            echo ""
            echo "The rsync target is not the host serving multiversestudios.xyz."
            echo "Check the HETZNER_HOST secret against: dig +short multiversestudios.xyz"
            exit 1
          fi
          echo "Verified: multiversestudios.xyz is serving ${{ github.sha }}"

      - name: Send Matrix notification on success
        if: success()
        env:
          MATRIX_WEBHOOK_URL: ${{ secrets.MATRIX_WEBHOOK_URL }}
        run: |
          if [ -n "$MATRIX_WEBHOOK_URL" ]; then
            curl -X POST "$MATRIX_WEBHOOK_URL" \
              -H "Content-Type: application/json" \
              -d '{
                "text": "✅ Marketing site deployed successfully\nCommit: ${{ github.sha }}\nAuthor: ${{ github.actor }}\nURL: https://multiversestudios.xyz/"
              }'
          fi

      - name: Send Matrix notification on failure
        if: failure()
        env:
          MATRIX_WEBHOOK_URL: ${{ secrets.MATRIX_WEBHOOK_URL }}
        run: |
          if [ -n "$MATRIX_WEBHOOK_URL" ]; then
            curl -X POST "$MATRIX_WEBHOOK_URL" \
              -H "Content-Type: application/json" \
              -d '{
                "text": "❌ Marketing site deploy failed\nCommit: ${{ github.sha }}\nAuthor: ${{ github.actor }}\nCheck: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
              }'
          fi
